    <h1>为什么我更喜欢 Persona 4</h1>
    <time datetime="2026-10-23">2026 年 10 月 23 日</time>
    <p>Persona 5 很华丽，但要我在 P4 和 P5 之间选，我永远站 P4。</p>
    <p>稻羽市那种小镇的氛围、伙伴之间像家人一样的关系、还有面对自己阴影的主题，过了这么多年还是很打动我。听说 Persona 4 Revival 要来了，10 月 30 日在曼谷 gamescom asia 还有制作人舞台，特别期待能看到更多实机画面。</p>
